name: Pipeline Fatec

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:

  testes:
    name: Testes automatizados
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar as dependências
        run: pip install -r requirements.txt

      - name: Rodar os testes
        run: python -m pytest -v

  codeql:
    name: CodeQL (análise do código)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar o CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          build-mode: none

      - name: Analisar o código
        uses: github/codeql-action/analyze@v3

  segredos:
    name: Busca de segredos
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar detect-secrets
        run: pip install detect-secrets

      - name: Procurar segredos
        run: |
          detect-secrets scan --all-files

  dependencias:
    name: Revisão de dependências
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Revisar dependências
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  deploy-staging:
    name: Deploy no staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - testes
      - codeql
      - segredos

    runs-on: ubuntu-latest

    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Empacotar aplicação
        run: |
          mkdir pacote
          cp app.py requirements.txt pacote/
          tar -czf app-staging.tar.gz -C pacote .

      - name: Guardar artefato
        uses: actions/upload-artifact@v4
        with:
          name: app-staging
          path: app-staging.tar.gz

      - name: Publicar no staging (simulado)
        env:
          AMBIENTE: ${{ vars.APP_ENV }}
        run: |
          echo "Publicando commit ${GITHUB_SHA::7} em $AMBIENTE"
          echo "Deploy concluído com sucesso!"